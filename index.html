<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Auditoría Informática - Logística Global S.A.
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #071b2b;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 1500px;
            text-align: center;
        }

        .infografia {
            display: block;
            width: 100%;
            height: auto;
            margin: auto;

            border-radius: 12px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.40);

            background: white;
        }

        .texto-pie {
            margin-top: 12px;
            color: #d9eef9;
            font-size: 14px;
            opacity: 0.85;
        }

        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            .texto-pie {
                font-size: 12px;
            }

        }
    </style>
</head>

<body>

    <main class="contenedor">

        <img
            class="infografia"
            src="a_clean_flat_vector_infographic_poster_no_people.png"
            alt="Infografía de Auditoría Informática - Logística Global S.A."
        >

        <div class="texto-pie">
            Infografía de Auditoría Informática ·
            Logística Global S.A. ·
            Universidad ECCI
        </div>

    </main>

</body>
</html>
